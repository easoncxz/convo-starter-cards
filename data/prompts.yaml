categories:

  - name: Self-Awareness & Identity
    questions:
      - What parts of myself do I hide from others, and why?
      - When do I feel most like myself?
      - What would I do differently if I knew no one was watching?
      - What story do I tell myself about who I am? Is it still true?
      - What qualities in others do I secretly wish I had?
      - How would my closest friend describe me? Would I agree?
      - What masks do I wear in different situations?
      - What does my inner critic most often say to me?
      - When was the last time I surprised myself?
      - What is the most important thing I've learned about myself this year?
      - What part of my personality did I inherit, and what did I choose?
      - If I could change one thing about how I see myself, what would it be?
      - What contradictions do I carry inside me, and can I hold them gently?
      - What do people misunderstand about me most often?
      - What am I like when I'm at my best? What conditions bring that out?

  - name: Insecurities & Fears
    questions:
      - What insecurity has been holding me back the most?
      - Are any of my insecurities hurting anyone else by accident?
      - What am I most afraid of people finding out about me?
      - When do I feel most vulnerable, and what do I do with that feeling?
      - What fear have I been avoiding looking at closely?
      - What would I attempt if I knew I couldn't fail?
      - How does my self-doubt show up in my daily life?
      - What am I protecting myself from by staying in my comfort zone?
      - What would it feel like to fully accept my biggest flaw?
      - When did I first start believing I wasn't enough?
      - What rejection am I still carrying with me?
      - What am I afraid will happen if I truly let someone in?
      - Which of my fears are inherited from my family, and which are my own?

  - name: Relationships & Connection
    questions:
      - What do I have to offer in a romantic relationship? What do I want to receive?
      - When do I feel most helpful to others?
      - What relationship in my life needs more attention right now?
      - How do I show love, and is it the way others need to receive it?
      - What conversation have I been avoiding?
      - Who in my life makes me feel safest? What do they do that creates that feeling?
      - What patterns do I repeat in relationships?
      - When was the last time I felt truly seen by someone?
      - What do I need from others that I'm not asking for?
      - How do I react when someone I love disappoints me?
      - What does healthy conflict look like to me?
      - Who have I outgrown, and am I at peace with that?
      - What would my relationships look like if I stopped people-pleasing?
      - When do I feel lonely even around others?
      - What do I wish someone would ask me?
      - How do I behave when I feel abandoned? Is that the person I want to be?
      - What am I giving in relationships because I genuinely want to, and what am I giving to be liked?

  - name: Growth & Change
    questions:
      - What am I ready to let go of?
      - What have I been putting off that my future self will thank me for?
      - What lesson keeps showing up in my life that I haven't fully learned?
      - What is the bravest thing I've done recently?
      - What small change could make the biggest difference in my life right now?
      - What am I tolerating that I don't have to?
      - How have I grown in the past year in ways I haven't acknowledged?
      - What old belief no longer serves me?
      - What would my life look like if I stopped waiting for permission?
      - What habit is quietly shaping my future?
      - Where am I settling for less than I deserve?
      - What discomfort am I willing to sit with in order to grow?
      - What have I unlearned that I'm proud of?

  - name: Values & Purpose
    questions:
      - What matters most to me when everything else falls away?
      - What would I fight for even if I knew I'd lose?
      - How am I spending my time versus how do I want to spend it?
      - What does a meaningful day look like to me?
      - What legacy am I building, even accidentally?
      - If I had unlimited resources, what problem would I try to solve?
      - What do I stand for that I haven't stood up for lately?
      - What does integrity mean to me in practice, not just theory?
      - When have I compromised my values, and how did it feel?
      - What would I want written on my gravestone?
      - What am I devoted to? Is it worthy of my devotion?
      - What principle would I not abandon even under pressure?

  - name: Emotions & Inner Life
    questions:
      - What emotion do I have the hardest time sitting with?
      - When was the last time I cried, and what was it really about?
      - What makes me feel alive?
      - How do I handle disappointment? Is that working for me?
      - What am I grieving that I haven't named yet?
      - When do I feel most at peace?
      - What does my anger usually try to tell me?
      - How do I comfort myself when things are hard?
      - What joy have I been postponing?
      - When do I feel most grateful?
      - What emotion am I suppressing right now?
      - What feeling keeps returning no matter how many times I push it away?
      - What does sadness feel like in my body? What about joy?

  - name: Past & Memory
    questions:
      - What childhood experience still influences how I act today?
      - What is my happiest memory, and what does it tell me about what I need?
      - What would I tell my younger self if I could?
      - What past version of myself do I miss?
      - What have I forgiven that once felt unforgivable?
      - What moment changed the direction of my life?
      - What did I need as a child that I can give myself now?
      - What story from my past am I ready to rewrite?
      - What did I believe at fifteen that I've since outgrown?
      - What regret has taught me the most?
      - What was I certain about five years ago that I now question?
      - Who from my past do I think about more often than I admit?

  - name: Future & Aspirations
    questions:
      - What does my ideal ordinary Tuesday look like five years from now?
      - What dream have I been afraid to take seriously?
      - What am I building toward, even if progress feels slow?
      - What would I do with one completely free year?
      - What future am I creating by doing nothing different?
      - What will I regret not starting today?
      - Where do I want to be, emotionally, one year from now?
      - What kind of old person do I want to become?
      - What adventure am I saving for "someday"?
      - What does "enough" look like for me?
      - If I knew I would succeed, what would I begin tomorrow?
      - What version of my life would make me feel proud at eighty?

  - name: Gratitude & Joy
    questions:
      - What simple pleasure do I take for granted?
      - Who has shaped me in ways they may never know?
      - What am I fortunate to have that I often overlook?
      - When was the last time I laughed until it hurt?
      - What small moment recently filled me with unexpected happiness?
      - What is beautiful about my life right now, even if things are hard?
      - What kindness has someone shown me that I still carry with me?
      - What about today is worth appreciating?
      - What am I proud of that no one else knows about?
      - What ordinary thing would I miss terribly if it were gone?

  - name: Boundaries & Self-Care
    questions:
      - What boundary do I need to set but haven't?
      - When do I say yes when I mean no?
      - How do I know when I've reached my limit?
      - What does rest truly look like for me, beyond sleeping?
      - What am I doing out of guilt instead of genuine desire?
      - How would my life change if I stopped overextending myself?
      - What do I owe myself that I keep giving away to others?
      - When was the last time I did something purely for my own enjoyment?
      - What does self-compassion look like on my hardest days?
      - What would happen if I treated myself with the kindness I give to friends?
      - How do I abandon myself in order to keep the peace?

  - name: Creativity & Expression
    questions:
      - What do I create when no one is looking?
      - What form of expression feels most natural to me?
      - What idea keeps coming back to me no matter how many times I dismiss it?
      - When do I feel most creative?
      - What would I make if I had no fear of judgment?
      - How do I express what words can't capture?
      - What is the last thing that truly inspired me?
      - What creative impulse have I been neglecting?
      - If I could master any art form overnight, which would I choose and why?

  - name: Work & Contribution
    questions:
      - What work would I do even if I weren't paid for it?
      - When do I feel most in flow?
      - How is my work connected to what I care about?
      - What skill do I have that I'm undervaluing?
      - What would I build if I had nothing to prove?
      - How do I want to be remembered by the people I work with?
      - What am I learning right now that excites me?
      - What would I contribute if titles and money didn't exist?
      - Am I doing meaningful work or just keeping busy?

  - name: Forgiveness & Healing
    questions:
      - What am I still punishing myself for?
      - Who do I need to forgive, including myself?
      - What wound am I afraid to fully heal because it's become part of my identity?
      - What apology do I need to give?
      - What apology do I need to receive?
      - How would my life change if I released all resentment?
      - What part of my story am I ashamed of that might actually help someone else?
      - What would true healing look like for my deepest hurt?
      - What am I holding onto that is heavier than I realize?
      - Can I separate what happened to me from who I am?

  - name: Body & Physical Self
    questions:
      - How does my body try to communicate with me?
      - When do I feel most comfortable in my own skin?
      - What has my body carried me through that I haven't thanked it for?
      - How do I speak to myself when I look in the mirror?
      - What does my body need that I've been ignoring?
      - When do I feel most physically at ease?
      - What would change if I listened to my body as carefully as I listen to my thoughts?

  - name: Solitude & Stillness
    questions:
      - What do I discover about myself when I'm truly alone?
      - What thoughts surface when everything is quiet?
      - Am I comfortable being alone? What does that tell me?
      - What am I avoiding by staying constantly busy or distracted?
      - What would I hear if I stopped to really listen to myself?
      - When did I last sit with silence and let it be enough?
      - What part of myself only appears in solitude?

  - name: Authenticity & Courage
    questions:
      - Where in my life am I performing instead of being?
      - What truth about myself am I afraid to speak out loud?
      - What would change if I stopped comparing myself to others?
      - When was the last time I was completely honest about how I feel?
      - What does courage look like in my everyday life?
      - What am I pretending not to know?
      - How would my life change if I cared less about what others think?
      - What would it cost me to be fully honest right now? What would it give me?
      - In what area of my life am I living someone else's idea of success?

  - name: Meaning & Mortality
    questions:
      - What would I do if I had one year left to live?
      - What gives my life meaning on the days when nothing feels special?
      - What do I want to be remembered for?
      - How do I want to spend my remaining time on this earth?
      - What would I want my loved ones to know if I couldn't tell them tomorrow?
      - What has loss taught me about what matters?
      - If today were my last day, would I be at peace with how I've lived?
      - What feels urgent that isn't, and what feels unimportant that is?

  - name: Compassion & Kindness
    questions:
      - How do I treat people who can do nothing for me?
      - What suffering in the world touches me most, and what does that reveal?
      - When was the last time I was truly generous without expecting anything back?
      - How do I respond to someone else's pain? Do I try to fix, flee, or stay?
      - What would the world look like if everyone treated others the way I treat myself?
      - Who in my life is quietly struggling that I could reach out to?
      - What act of kindness changed me?

  - name: Home & Belonging
    questions:
      - Where do I feel most at home, and why?
      - What does belonging feel like to me?
      - What community am I part of that I haven't fully appreciated?
      - Do I feel like I belong in my own life?
      - What am I homesick for that isn't a place?
      - Where in the world does my soul feel quiet?
      - What would I need to feel truly settled?
